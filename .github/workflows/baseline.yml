# The checks every repository runs, whatever its language. Callers name one job
# `Baseline` that needs the call, so the required check stays fixed while jobs
# come and go here.
name: Baseline

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  leaks:
    name: leaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/leaks@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
  dco:
    name: dco
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/dco@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
  reuse:
    name: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: 0.13.9
      # renovate: datasource=pypi depName=reuse
      REUSE_VERSION: 6.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          packages: uv@${{ env.UV_VERSION }} reuse@${{ env.REUSE_VERSION }}
      - run: reuse lint
  harper:
    name: harper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Findings stay warnings until every repository is fixed.
      - uses: metio/ci/harper@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          fail: "false"
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/policy-check@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
