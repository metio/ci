name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    # Which shipped actions the pull request touches. Baseline checks every
    # pull request with the pinned actions, so a job dogfooding an action of
    # this commit only runs when that action changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.paths.outputs.policy }}
      dco: ${{ steps.paths.outputs.dco }}
      leaks: ${{ steps.paths.outputs.leaks }}
      breto: ${{ steps.paths.outputs.breto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          touches() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            echo "policy=$(touches '^(policy|policy-check)/')"
            echo "dco=$(touches '^dco/')"
            echo "leaks=$(touches '^(leaks|breto)/')"
            echo "breto=$(touches '^breto/')"
          } >> "$GITHUB_OUTPUT"
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          registries: github:metio/toolchains
      - run: ci-yaml
  github-actions:
    # actionlint shells out to shellcheck for `run:` blocks; a failing finding
    # blocks the merge across the whole tree (the reusable workflow and every
    # composite action are what this repo ships).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          registries: github:metio/toolchains
      - run: ci-actionlint
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          registries: github:metio/toolchains
      - run: ci-markdown
  dco:
    # Dogfood the dco action of this commit; Baseline runs the pinned one.
    # Bot PRs skip.
    needs: [changes]
    if: needs.changes.outputs.dco == 'true' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./dco # zizmor: ignore[self-repository] dogfoods the action of this commit
  policy:
    needs: [changes]
    if: needs.changes.outputs.policy == 'true'
    # Dogfood the policy-check action of this commit, so a change to a policy
    # is checked against our own workflows, actions and Containerfiles.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./policy-check # zizmor: ignore[self-repository] dogfoods the action of this commit
  breto:
    needs: [changes]
    if: needs.changes.outputs.breto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          project: breto/testdata
      - run: jq --version
  breto-packages:
    needs: [changes]
    if: needs.changes.outputs.breto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          packages: jq
      - run: jq --version
  leaks-probe:
    needs: [changes]
    if: needs.changes.outputs.leaks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create a clean and a leaking repository
        run: |
          set -euo pipefail
          for name in clean leaking; do
            git init --quiet "probe/${name}"
            git -C "probe/${name}" -c user.name=probe -c user.email=probe@example.com commit --quiet --allow-empty --message base
          done
          chars=$(head -c 1024 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9')
          token="ghp_${chars:0:36}"
          printf 'token = "%s"\n' "$token" > probe/leaking/settings
          git -C probe/leaking add settings
          git -C probe/leaking -c user.name=probe -c user.email=probe@example.com commit --quiet --message token
      - uses: ./leaks # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          path: probe/clean
          range: --all
      - id: leaking
        continue-on-error: true
        uses: ./leaks # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          path: probe/leaking
          range: --all
      - name: Require the planted token to be found
        env:
          OUTCOME: ${{ steps.leaking.outcome }}
        run: '[ "$OUTCOME" = failure ] || { echo "::error::the planted token went unreported"; exit 1; }'
  verify:
    # Single required check: mark only this one required in branch protection and
    # new jobs are covered automatically. Mirrors the pattern this repo gives
    # consumers via golang.yml.
    name: Verify
    needs: [changes, yaml, github-actions, markdown, dco, policy, breto, breto-packages, leaks-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
