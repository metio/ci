name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command ci-reuse
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command ci-yaml
  github-actions:
    # actionlint shells out to shellcheck for `run:` blocks; a failing finding
    # blocks the merge across the whole tree (the reusable workflow and every
    # composite action are what this repo ships).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command ci-actionlint
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command ci-markdown
  dco:
    # Dogfood the dco action this repo ships: every commit must carry a
    # Signed-off-by trailer. The require-dco policy (run by the policy job below)
    # holds this very workflow to having this job. Bot PRs skip.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./dco # zizmor: ignore[self-repository] dogfoods the action of this commit
  policy:
    # Dogfood the policy-check action this repo ships: it runs the conftest
    # convention policies (SHA-pinned uses, no local refs in reusable workflows,
    # no untrusted run: interpolation, permissions, release concurrency, job
    # timeouts, require-dco) over our own workflows and actions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./policy-check # zizmor: ignore[self-repository] dogfoods the action of this commit
  breto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          project: breto/testdata
      - run: jq --version
  breto-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./breto # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          packages: jq
      - run: jq --version
  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./leaks # zizmor: ignore[self-repository] dogfoods the action of this commit
  leaks-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create a clean and a leaking repository
        run: |
          set -euo pipefail
          for name in clean leaking; do
            git init --quiet "probe/${name}"
            git -C "probe/${name}" -c user.name=probe -c user.email=probe@example.com commit --quiet --allow-empty --message base
          done
          token="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 36)"
          printf 'token = "%s"\n' "$token" > probe/leaking/settings
          git -C probe/leaking add settings
          git -C probe/leaking -c user.name=probe -c user.email=probe@example.com commit --quiet --message token
      - uses: ./leaks # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          path: probe/clean
          range: --all
      - id: leaking
        continue-on-error: true
        uses: ./leaks # zizmor: ignore[self-repository] dogfoods the action of this commit
        with:
          path: probe/leaking
          range: --all
      - name: Require the planted token to be found
        env:
          OUTCOME: ${{ steps.leaking.outcome }}
        run: '[ "$OUTCOME" = failure ] || { echo "::error::the planted token went unreported"; exit 1; }'
  verify:
    # Single required check: mark only this one required in branch protection and
    # new jobs are covered automatically. Mirrors the pattern this repo gives
    # consumers via golang.yml.
    name: Verify
    needs: [reuse, yaml, github-actions, markdown, dco, policy, breto, breto-packages, leaks, leaks-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
