name: Frontend

# Reusable Vite/React (Node) pipeline for metio projects. Every gate runs through
# the calling repo's nix flake devShell (`nix develop --command`), so CI resolves
# the exact tool versions in flake.lock — node, chromium (via playwright-driver),
# and the shared metio lint gate (reuse, typos, yamllint, actionlint,
# markdownlint) — identical to a local run. A `detect` job reads the caller's
# package.json scripts (and lighthouserc.json) and skips the gates a repo does
# not define, so one workflow fits projects that ship different subsets.
#
#   jobs:
#     frontend:
#       name: Frontend      # so checks read "Frontend / build", "Frontend / lint", …
#       uses: metio/ci/.github/workflows/frontend.yml@v1
#       with:
#         node-options: --dns-result-order=ipv4first
#         build-command: PLINKY_LOCALE=en npm run build
#
# The caller keeps its own repo-specific jobs and one all-green aggregate (named
# "Verify") that lists this `frontend` job — that aggregate is the single
# required check (see README). A repo that consumes this MUST ship a flake.nix
# whose devShell provides node, chromium (PLAYWRIGHT_BROWSERS_PATH →
# playwright-driver.browsers), and the shared lint gate.
#
# The convention is script names: a gate runs when the caller defines the
# matching npm script (test:browser, test:storybook, coverage, size, lint, knip,
# a11y:light, a11y:dark) or, for lighthouse, a lighthouserc.json. Missing scripts
# skip. A caller whose test runner would sweep every project into `coverage`
# should scope that script to the instrumented ones: story screenshots measure
# nothing and starve under instrumentation, and this workflow runs them on their
# own.
#
# The lighthouse job audits the site the build job already produced, passed along
# as an artifact, so the build happens once and both the size budget and the
# per-page audits weigh the same bytes. Its directory comes from the caller's
# lighthouserc.json (`ci.collect.staticDistDir`), so nothing needs configuring.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      node-options:
        description: >
          Value for NODE_OPTIONS across every job (e.g.
          --dns-result-order=ipv4first when a prerender server binds localhost).
        type: string
        default: ""
      build-command:
        description: >
          The build invocation for the build/size and lighthouse jobs. Override
          to pass build-time env (e.g. a single-locale build for a per-visitor
          bundle-size measurement).
        type: string
        default: npm run build

permissions:
  contents: read

env:
  NODE_OPTIONS: ${{ inputs.node-options }}
  # Expanded by the run-step shell into the nix command; `inputs.*` is caller-
  # controlled (trusted), not an attacker-influenced context.
  BUILD_COMMAND: ${{ inputs.build-command }}

jobs:
  detect:
    name: detect
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    outputs:
      typecheck: ${{ steps.env.outputs.typecheck }}
      test: ${{ steps.env.outputs.test }}
      build: ${{ steps.env.outputs.build }}
      size: ${{ steps.env.outputs.size }}
      test_browser: ${{ steps.env.outputs.test_browser }}
      test_storybook: ${{ steps.env.outputs.test_storybook }}
      coverage: ${{ steps.env.outputs.coverage }}
      lint: ${{ steps.env.outputs.lint }}
      knip: ${{ steps.env.outputs.knip }}
      a11y_light: ${{ steps.env.outputs.a11y_light }}
      a11y_dark: ${{ steps.env.outputs.a11y_dark }}
      lighthouse: ${{ steps.env.outputs.lighthouse }}
      lighthouse_dist: ${{ steps.env.outputs.lighthouse_dist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: env
        # jq ships on the runner, so detection needs no devShell — it only reads
        # package.json. Each optional gate below keys off one of these flags.
        run: |
          has_script() { jq -e --arg s "$1" '.scripts[$s] // empty' package.json >/dev/null 2>&1; }
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "detected: $1=$2"; }
          for script in typecheck test build size test:browser test:storybook coverage lint knip a11y:light a11y:dark; do
            key=${script//:/_}
            if has_script "$script"; then emit "$key" true; else emit "$key" false; fi
          done
          if [ -f lighthouserc.json ] || [ -f lighthouserc.js ]; then emit lighthouse true; else emit lighthouse false; fi
          # Where the built site lands, so the build job can hand exactly that
          # directory to the lighthouse job instead of it building a second copy.
          # Only the JSON form can be read here; a lighthouserc.js caller keeps the
          # default, which is the conventional Vite/React Router output.
          dist=build/client
          if [ -f lighthouserc.json ]; then
            dist=$(jq -r '.ci.collect.staticDistDir // "build/client"' lighthouserc.json)
          fi
          emit lighthouse_dist "${dist#./}"

  build:
    name: build
    needs: detect
    if: >-
      needs.detect.outputs.build == 'true' || needs.detect.outputs.test == 'true'
      || needs.detect.outputs.typecheck == 'true' || needs.detect.outputs.lighthouse == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - if: needs.detect.outputs.typecheck == 'true'
        run: nix develop --command npm run typecheck
      - if: needs.detect.outputs.test == 'true'
        run: nix develop --command npm test
      # The build feeds the size budget and the lighthouse audit, so it runs
      # whenever any of the three is present.
      - if: >-
          needs.detect.outputs.build == 'true' || needs.detect.outputs.size == 'true'
          || needs.detect.outputs.lighthouse == 'true'
        run: nix develop --command bash -c "$BUILD_COMMAND"
      - if: needs.detect.outputs.size == 'true'
        name: Check bundle size
        run: nix develop --command npm run size
      # Hand the built site to the lighthouse job rather than have it install and
      # build a second, identical copy. Both jobs must measure the same bytes for
      # the per-page budgets to mean anything, and one build is how that is
      # guaranteed rather than hoped for. The whole directory travels, content
      # assets included: an audited page that fetches its data at runtime would
      # otherwise log console errors and score against a site nobody ships.
      - if: needs.detect.outputs.lighthouse == 'true'
        name: Upload the built site for the lighthouse job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: ${{ needs.detect.outputs.lighthouse_dist }}
          retention-days: 1
          include-hidden-files: true

  browser:
    name: browser
    needs: detect
    if: needs.detect.outputs.test_browser == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      # Chromium comes from the flake (PLAYWRIGHT_BROWSERS_PATH → the nix-store
      # playwright-driver browsers), so no `playwright install --with-deps` and no
      # registry image. The caller holds its `playwright` npm version to the
      # driver's.
      - run: nix develop --command npm run test:browser

  storybook:
    name: storybook
    needs: detect
    if: needs.detect.outputs.test_storybook == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      # Story screenshots compare against committed baselines, so they want a browser
      # rendering at its normal speed — not one racing an instrumented coverage run,
      # where they starve and flake on timing rather than on any real visual change.
      - run: nix develop --command npm run test:storybook

  coverage:
    name: coverage
    needs: detect
    if: needs.detect.outputs.coverage == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - run: nix develop --command npm run coverage

  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.lint == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - run: nix develop --command npm run lint

  knip:
    name: knip
    needs: detect
    if: needs.detect.outputs.knip == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - run: nix develop --command npm run knip

  accessibility-light:
    name: accessibility-light
    needs: detect
    if: needs.detect.outputs.a11y_light == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - run: nix develop --command npm run a11y:light

  accessibility-dark:
    name: accessibility-dark
    needs: detect
    if: needs.detect.outputs.a11y_dark == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command npm ci
      - run: nix develop --command npm run a11y:dark

  lighthouse:
    name: lighthouse
    needs: [detect, build]
    if: needs.detect.outputs.lighthouse == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The site arrives prebuilt from the build job, so this job needs neither the
      # devShell nor node_modules: the action brings its own Chrome and node and
      # reads only the static directory and the config file from the checkout.
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: ${{ needs.detect.outputs.lighthouse_dist }}
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true

  reuse:
    name: reuse
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-reuse

  typos:
    name: typos
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-typos

  yaml:
    name: yaml
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-yaml

  github-actions:
    name: github-actions
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # actionlint shells out to shellcheck (in the devShell) for run: blocks.
      - run: nix develop --command ci-actionlint

  markdown:
    name: markdown
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-markdown
