name: Clojure

# Reusable Clojure pipeline for metio projects. Every job installs the calling
# repo's toolchain with the breto action from its .breto.edn, which names the
# metio/toolchains groups, so CI runs the exact tool versions a local breto env
# links.
#
# The caller's contract:
#   - a .breto.edn naming a JDK group (@jdk17, @jdk25 or @graalvm) and
#     @clojure, which provides babashka, clj-kondo and the clojure command
#   - deps.edn aliases :test (kaocha or equivalent), :eastwood, :splint,
#     :cljfmt, and :watson — the deep-analysis battery rides tools.deps, so
#     versions live in deps.edn where Renovate maintains them
#   - clj-kondo config in .clj-kondo/, cljfmt config in .cljfmt.edn,
#     splint config in .splint.edn as needed
#
#   jobs:
#     clojure:
#       name: Clojure       # so checks read "Clojure / test", "Clojure / lint", …
#       uses: metio/ci/.github/workflows/clojure.yml@v1
#
# The caller keeps its own non-Clojure jobs and one all-green aggregate
# (named "Verify") that lists this `clojure` job — that aggregate is the
# single required check (see README).
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      kondo-paths:
        description: Source roots for clj-kondo.
        type: string
        default: src test

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@78517938c316d760b945fcc17cadbe61728b1d02 # 2026.10.30181349
        with:
          registries: github:metio/toolchains
      - run: clojure -M:test

  lint:
    name: lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@78517938c316d760b945fcc17cadbe61728b1d02 # 2026.10.30181349
        with:
          registries: github:metio/toolchains
      # clj-kondo is the fast first line; the caller's config keeps it at
      # 0 errors AND 0 warnings — warnings rot into wallpaper otherwise.
      - env:
          KONDO_PATHS: ${{ inputs.kondo-paths }}
        run: |
          # shellcheck disable=SC2086 # the input is deliberately word-split
          clj-kondo --fail-level warning --lint $KONDO_PATHS

  analyze:
    name: analyze
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@78517938c316d760b945fcc17cadbe61728b1d02 # 2026.10.30181349
        with:
          registries: github:metio/toolchains
      # eastwood: deep analysis over macroexpanded code (reflection,
      # shadowing, suspicious expressions)
      - run: clojure -M:eastwood
      # splint: idiom/style patterns (the kibit lineage, maintained)
      - run: clojure -M:splint

  format:
    name: format
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@78517938c316d760b945fcc17cadbe61728b1d02 # 2026.10.30181349
        with:
          registries: github:metio/toolchains
      - run: clojure -M:cljfmt check

  vulnerabilities:
    name: vulnerabilities
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@78517938c316d760b945fcc17cadbe61728b1d02 # 2026.10.30181349
        with:
          registries: github:metio/toolchains
      # clj-watson against the GitHub advisory database; a reachable
      # advisory blocks merge. The token is only read, never written.
      - run: clojure -M:watson -p deps.edn -t github-advisory
        env:
          GITHUB_TOKEN: ${{ github.token }}
