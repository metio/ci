name: harper
description: >
  Lint the prose of the Markdown files a repository tracks with harper-cli,
  with the rules every metio repository shares. It reads docs and kb, or the
  whole tree when neither exists, and skips files git marks
  linguist-generated. Each finding becomes an annotation on its line.

inputs:
  path:
    description: The repository to lint, relative to the workspace.
    required: false
    default: .
  paths:
    description: >
      Paths inside the repository to lint, separated by spaces, in place of
      docs and kb.
    required: false
    default: ""
  ignore:
    description: >
      Further harper rules to skip, separated by commas, on top of the rules
      every repository skips.
    required: false
    default: ""
  fail:
    description: >
      Whether a finding fails the step. With false, findings are annotated as
      warnings and the step succeeds.
    required: false
    default: "true"
  harper-version:
    description: harper-cli release to install.
    required: false
    # renovate: datasource=github-releases depName=Automattic/harper extractVersion=^v(?<version>.+)$
    default: "3.0.0"

runs:
  using: composite
  steps:
    - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
      with:
        packages: harper-cli@${{ inputs.harper-version }}
    - name: Lint the prose
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        LINT_PATHS: ${{ inputs.paths }}
        HARPER_IGNORE: ${{ inputs.ignore }}
        HARPER_FAIL: ${{ inputs.fail }}
        SCRIPT: ${{ github.action_path }}/harper.sh
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/${LINT_PATH}"
        read -r -a paths <<< "${LINT_PATHS}"
        "${SCRIPT}" "${paths[@]}"
