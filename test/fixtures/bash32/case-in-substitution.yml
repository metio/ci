# A script bash 3.2 rejects and a current bash accepts: inside `$( )`, bash
# 3.2 closes the substitution at the `)` of a case pattern written without its
# leading `(`. test/bash-syntax.sh requires bash 3.2 to reject it.
name: case pattern inside a command substitution
description: A cache-key step whose case pattern lacks its leading parenthesis.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REGISTRIES: ${{ inputs.registries }}
      run: |
        set -euo pipefail
        key=$({
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            case "$dir" in github:* | gitlab:* | "{"*) continue ;; esac
            find "$dir" -maxdepth 1 -name '*.edn' -type f | LC_ALL=C sort | xargs cat
          done <<< "$REGISTRIES"
        } | sha256sum | cut -d ' ' -f 1)
        echo "key=${key}"
